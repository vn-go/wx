syntax = "proto3";

package dynamic;
option go_package = "grpc-dynamic/pb"; 

message GrpcCall {
  string grpc_endpoint = 1;
  bytes args = 2;
}

message GrpcResult {
  bytes result = 1;
  string error = 2;
}

service DynamicService {
  rpc Invoke (GrpcCall) returns (GrpcResult);
}
